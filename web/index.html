  <!--
    PostHog analytics. Loaded before the Flutter bundle so the initial
    $pageview is recorded even when main.dart.js is slow (or fails) to boot.

    Division of labour:
      * this snippet  — the $pageview for the initial load (plus $pageleave,
        geo-IP, device, referrer, UTMs). Doing it here means a visit still
        registers if main.dart.js never boots.
      * lib/services/analytics/ — every pageview *after* that, and every custom
        event (section views, clicks, contact-form funnel).

    PostHog's own SPA detection is deliberately not used. go_router's
    `context.push()` records /works/<slug> as an imperative match and leaves
    window.location at "/", so the browser reports no URL change and no
    pageview would ever fire for a case study. Dart reports the real route
    instead — see `_AnalyticsRouteObserver` in lib/main.dart.

    Autocapture, heatmaps and dead-click detection are off on purpose: Flutter
    web paints into a single <canvas>, so DOM-based capture records nothing
    meaningful and only inflates the event volume.
  -->
  <script>
    (function () {
      // Write-only project API key — designed to be public, safe to ship.
      var POSTHOG_KEY = 'phc_A5EDR5QozFbsnLd7BQx8KdrDTUCyQAxQPjyzkVJUukpP';
      var POSTHOG_HOST = 'https://us.i.posthog.com';
      var POSTHOG_ASSETS = 'https://us-assets.i.posthog.com';

      // Keep `flutter run -d chrome` traffic out of the real project. Flip to
      // true to verify tracking locally, then flip back before deploying.
      var TRACK_LOCALHOST = false;

      var hostname = window.location.hostname;
      var isLocal = hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname === '[::1]' ||
          hostname === '';
      if (isLocal && !TRACK_LOCALHOST) return;

      var script = document.createElement('script');
      script.src = POSTHOG_ASSETS + '/static/array.js';
      script.async = true;
      script.onload = function () {
        window.posthog.init(POSTHOG_KEY, {
          api_host: POSTHOG_HOST,
          defaults: '2025-05-24',
          // Anonymous events only (4x cheaper). Country/city/browser/referrer
          // still arrive as event properties, which is what the dashboards use.
          person_profiles: 'identified_only',
          // `true` (not 'history_change') = initial load only; Dart owns the
          // rest, so a route change can never be counted twice.
          capture_pageview: true,
          capture_pageleave: true,
          autocapture: false,
          capture_heatmaps: false,
          capture_dead_clicks: false,
          // Session replay of a <canvas> app is heavy and near-unreadable.
          disable_session_recording: true,
          debug: isLocal
        });
      };
      document.head.appendChild(script);
    })();
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
